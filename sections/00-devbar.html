<!-- DEV: temporary floating theme toggle. The production toggle ships in the Footer (Batch 5). -->
<div class="devbar" role="group" aria-label="Theme override">
  <span class="devbar__label t-label-sm u-uppercase">Theme</span>
  <span class="devbar__info" tabindex="0" role="note" aria-label="About this theme switch">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="4.9" r="0.95" fill="currentColor"/></svg>
    <span class="devbar__tip" role="tooltip">Prototype only — on the live site the theme follows your device automatically, with a manual toggle in the footer.</span>
  </span>
  <div class="seg">
    <button class="seg__btn" data-theme-option="system">System</button>
    <button class="seg__btn" data-theme-option="light">Light</button>
    <button class="seg__btn" data-theme-option="dark">Dark</button>
  </div>
</div>
